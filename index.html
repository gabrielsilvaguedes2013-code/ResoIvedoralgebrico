<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conjunções — Aprenda e Teste</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f1ff;
  color:#252238;
}

header{
  background:linear-gradient(135deg,#7057d9,#9b7bea);
  color:white;
  text-align:center;
  padding:38px 18px;
}

header h1{
  margin:0 0 8px;
  font-size:38px;
}

header p{
  margin:0;
  font-size:18px;
}

nav{
  position:sticky;
  top:0;
  z-index:5;
  background:white;
  padding:12px;
  text-align:center;
  box-shadow:0 2px 10px #0001;
}

nav a{
  display:inline-block;
  margin:4px 8px;
  padding:9px 15px;
  border-radius:20px;
  text-decoration:none;
  color:#5944a8;
  font-weight:bold;
}

nav a:hover{
  background:#eee9ff;
}

main{
  max-width:900px;
  margin:auto;
  padding:25px 16px;
}
